<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size reference marker</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font:15px system-ui,sans-serif;color:#222}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px}
  img{height:min(78vh,78vw);image-rendering:pixelated}
  p{margin:0;max-width:640px;text-align:center}
</style></head><body>
<div class="wrap">
  <img src="/marker.png?id=0" alt="ArUco marker 0 (4x4)">
  <p>Set screen brightness high and press F11 for full screen. Measure the <b>black square's</b> side with a tape
     and put it in <code>.env</code> as <code>MARKER_SIZE_CM</code>. Place the laptop on or against the shelving unit, screen facing out.</p>
</div>
</body></html>
